name: Omsk Health Scraper

on:
  schedule:
    # Запуск каждые 30 минут
    - cron: '*/30 * * * *'
  workflow_dispatch: # Кнопка ручного запуска в интерфейсе GitHub

jobs:
  scrape_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Чек-аут репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей
        run: |
          pip install requests beautifulsoup4

      - name: Запуск парсера
        run: |
          python backend/runner.py

      - name: Сохранение обновлений в репозиторий
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "auto: обновление данных с omskzdrav [skip ci]" || exit 0
          git push